# fly.toml app configuration file generated for asset-tracker on 2026-02-26T15:22:58+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'asset-tracker'
primary_region = 'ams'
console_command = '/code/manage.py shell'

[build]

# [deploy]
#  release_command = 'python manage.py migrate --noinput && python manage.py collectstatic --noinput'

[deploy]
  release_command = "sh -c 'python manage.py migrate --noinput && python manage.py collectstatic --noinput'"

[env]
  PORT = '8000'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024

[[statics]]
  guest_path = '/code/static'
  url_prefix = '/static/'
